name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  ci:
    name: Lint, format, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck (app)
        run: pnpm run typecheck

      - name: Typecheck (cms package)
        run: pnpm --filter cms run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_PRISMIC_ENVIRONMENT: ${{ vars.NEXT_PUBLIC_PRISMIC_ENVIRONMENT }}
          PRISMIC_ACCESS_TOKEN: ${{ secrets.PRISMIC_ACCESS_TOKEN }}
