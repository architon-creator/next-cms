name: Reusable CI

on:
  workflow_call:
    secrets:
      NEXUZ_SNYK_TOKEN:
        required: false
      ACCESSIBILITY_API_KEY:
        required: false
      PRISMIC_ACCESS_TOKEN:
        required: false
    inputs:
      app_name:
        required: true
        type: string
      app_path:
        required: true
        type: string
      run_tests:
        required: false
        type: boolean
        default: true
      aws_region:
        required: false
        type: string
        default: ""
      aws_oidc_role_arn:
        required: false
        type: string
        default: ""
      aws_account_id:
        required: false
        type: string
        default: ""
      aws_codeartifact_domain:
        required: false
        type: string
        default: ""
      aws_codeartifact_repository:
        required: false
        type: string
        default: ""

jobs:
  ci:
    name: "Quality Gate (chunk 1d: contents:read only)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Echo
        run: echo "app=${{ inputs.app_name }} path=${{ inputs.app_path }}"
