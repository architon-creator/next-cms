name: Reusable App Deploy

# Explicitly triggers a Vercel deployment via the Vercel CLI and waits for
# it to finish, instead of relying on Vercel's own git-integration
# auto-deploy. Split into separate build and deploy jobs (mirroring the
# real project's ci -> build -> deploy structure and the artifact-handoff
# pattern used in reusable-app-build.yml) rather than running `vercel
# build` and `vercel deploy` back-to-back in one job.
#
# Requires VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID as secrets on
# the calling workflow (none of these exist yet in this repo — see the
# entry workflow for where to add them). Until Vercel's own git-integration
# auto-deploy is turned off for this project, running this workflow will
# produce a second, duplicate deployment for the same push.

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      app_path:
        required: true
        type: string
      environment:
        required: false
        type: string
        default: production
        description: "'production' or 'preview'"
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true
    outputs:
      deployment_url:
        description: URL of the deployment produced by this run.
        value: ${{ jobs.deploy.outputs.deployment_url }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: ${{ inputs.app_path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # `vercel build` shells out to `pnpm install` once it detects
      # pnpm-lock.yaml — pnpm isn't preinstalled on the runner the way
      # Node/npm are, so without this it fails with "spawn pnpm ENOENT".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@42

      - name: Pull Vercel environment info
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          else
            vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          fi

      - name: Build project artifacts
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

      # The .vercel directory MUST travel between jobs as a tarball, not as
      # loose files. Under pnpm, .vercel/output/functions/*.func/node_modules
      # is a tree of symlinks (into node_modules/.pnpm/...), and
      # upload-artifact follows symlinks rather than storing them — any link
      # whose target resolves outside the upload root is silently dropped.
      # The deploy job then downloads an output tree with dangling paths and
      # `vercel deploy --prebuilt` rejects it with:
      #   Please ensure project dependencies have been installed:
      #   File does not exist: "node_modules/.pnpm/@next+env@.../dist/index.js"
      # tar stores symlinks as symlinks, so the round-trip is lossless.
      #
      # Tars the whole .vercel/ directory, not just .vercel/output —
      # `vercel deploy --prebuilt` also needs .vercel/project.json (written
      # by `vercel pull` above) to know which project/org it's deploying to.
      - name: Package build output
        run: tar -czf vercel-build.tar.gz .vercel

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-vercel-build
          path: ${{ inputs.app_path }}/vercel-build.tar.gz
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: ${{ inputs.app_path }}
    steps:
      # No checkout: everything `vercel deploy --prebuilt` needs is inside
      # the tarball. app_path may not exist yet, so create it first.
      - name: Prepare workspace
        working-directory: .
        run: mkdir -p "${{ inputs.app_path }}"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.app_name }}-vercel-build
          path: ${{ inputs.app_path }}

      - name: Unpack build output
        run: |
          tar -xzf vercel-build.tar.gz
          test -f .vercel/project.json
          test -d .vercel/output

      - name: Install Vercel CLI
        run: npm install --global vercel@42

      - name: Deploy to Vercel
        id: deploy
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          fi
          echo "deployment_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed ${{ inputs.app_name }} (${{ inputs.environment }}): $URL" >> "$GITHUB_STEP_SUMMARY"
