services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "9411:9411" # Zipkin compatible endpoint
    # Note: 4317/4318 are intentionally NOT published to the host — apps
    # send to the otel-collector below, which forwards to Jaeger over the
    # internal docker network (jaeger:4317).
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HTTP_PORT=9411
      - STORAGE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    volumes:
      - jaeger-storage:/badger
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC receiver — apps point here
      - "4318:4318" # OTLP HTTP receiver
    depends_on:
      jaeger:
        condition: service_healthy

  # --- Login (see docs/ibe-login.md) -------------------------------------
  # Session store for the Next.js OIDC login. Without REDIS_URL the app falls
  # back to in-memory sessions in development (never in production).
  redis:
    image: redis:7-alpine
    container_name: ibe-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # A local OpenID Connect identity provider that stands in for the vendor
  # until their login page is ready. The realm in docker/keycloak/ibe-realm.json
  # has the client, a test user and the audience/scope the Java API expects.
  # Start it with: docker compose up -d keycloak   (UI: http://localhost:8081)
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: ibe-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8081:8080" # 8080 is left free for other tools

volumes:
  jaeger-storage:
