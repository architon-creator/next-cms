# Ruleset for the "Run Axe Linter" step in reusable-ci.yml (schema: docs.deque.com/linter/4.0.0/en/axe-linter-configuration).
# A rule runs if it carries any tag below (no wcag22a — 2.2 added no new Level A criteria); together these are WCAG 2.2 AA, this project's target.
tags:
  - wcag2a
  - wcag2aa
  - wcag21a
  - wcag21aa
  - wcag22aa
  - best-practice

# Static analysis over source, not build output or test files.
exclude:
  - '**/*.test.*'
  - '**/*.spec.*'
  - '**/node_modules/**'
  - '**/.next/**'
  - '**/dist/**'
