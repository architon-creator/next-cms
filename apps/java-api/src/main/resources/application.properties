# Express API is on 4000; this one sits next to it on 4001.
server.port=${PORT:4001}

# Same limits as the Express/multer version: 5 MB per image, up to 10 images
# (+ the JSON payload part).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=60MB
# Tomcat caps the number of multipart parts (default 10); 10 images + payload
# needs more.
server.tomcat.max-part-count=20

# Products and their image rows are stored in an H2 file database (relative to
# the working directory, i.e. apps/java-api/data/productdb.mv.db). Tables are
# created/updated automatically. To use PostgreSQL or MySQL later, swap the
# datasource url/driver and the h2 dependency in pom.xml.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/productdb}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Browse the tables at http://localhost:4001/h2-console
# (JDBC URL: jdbc:h2:file:./data/productdb, user sa, empty password).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Where uploaded images are written (relative to the working directory) and
# served from under /uploads/**.
app.upload-dir=uploads

# --- Login (OAuth2 resource server) -----------------------------------------
# /api/** needs a bearer token from the identity provider; /demo/** stays open.
# The issuer's keys are fetched on the first token, not at startup.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER:http://localhost:9000}
# The `aud` the identity provider puts in access tokens for this API.
ibe.security.audience=${API_AUDIENCE:ibe-api}
