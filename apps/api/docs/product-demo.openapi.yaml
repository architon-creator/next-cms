openapi: 3.0.3
info:
  title: Product demo API
  version: 0.1.0
  description: |
    Multipart upload demo. The product JSON travels in a `payload` part and the
    images in `productImage` file parts. `product.productImage` in the payload
    lists the file names in upload order; the response replaces them with the
    stored image URLs.

    ## Why the image files are not inside the JSON payload

    1. **JSON has no binary type.** It holds text, numbers, booleans, arrays and
       objects. A file is raw bytes, so it cannot be a JSON field as it is.
    2. **The only way to embed it is base64**, which has real costs:
       - the encoded image is about 33% larger than the original file;
       - the whole file is held in memory as one big string, in the browser and
         again on the server, which is slow for large or multiple images;
       - servers and gateways often cap JSON body size, so images would hit the
         limit much sooner than as file parts;
       - the JSON becomes unreadable in logs, the network tab and API docs.
    3. **Multipart is built for this.** `multipart/form-data` sends text fields and
       raw file bytes in one request with no encoding overhead, and the server
       (multer) can enforce per-file size and type limits as the upload arrives.
    4. **The structure is kept.** `payload` keeps the full object shape, including
       `product.productImage`, which lists the image file names in upload order.
       The backend swaps each name for the stored image URL, and the response
       returns the same object with URLs filled in.
    5. **Tooling works.** Swagger UI, Postman and curl give a file picker for a
       top-level file part, but not for a field inside a JSON object.

    **Trade-off:** the client must keep `product.productImage` in the same order
    and count as the uploaded `productImage` files, otherwise the API returns 400.

    ## Limitation: file names in the payload are not verified

    The `productImage` names in the payload exist only to keep the JSON in its
    final shape. The API checks that their **count** equals the number of
    uploaded files and then matches them to the files **by position**. It never
    reads the name values, so they do not have to equal the real file names, and
    a wrong order is not detected. The client must keep the order in sync.
servers:
  - url: http://localhost:4000
    description: Express API (apps/api)
paths:
  /demo/products:
    post:
      summary: Create a product with images
      operationId: createProduct
      tags: [Product demo]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [payload, productImage]
              properties:
                payload:
                  allOf:
                    - $ref: "#/components/schemas/ProductPayload"
                  description: |
                    Product JSON, sent as a form part with content type
                    application/json (see `encoding` below). Click "Try it out"
                    to get this field pre-filled with a dummy object.
                  example:
                    category: SampleCategory
                    product:
                      itemCode: SAMPLE
                      pricingModel: SAMPLE_A
                      tags: [1, 2]
                      saleStartDate: "2026-08-01 00:00:00"
                      saleEndDate: "2026-08-31 23:59:59"
                      applicationStartDate: "2026-08-01 00:00:00"
                      applicationEndDate: "2026-12-31 23:59:59"
                      price: 500
                      currency: USD
                      visibleOnWeb: true
                      discountRate: 10
                      memberDiscountNote: sample content
                      secondaryDiscountRate: 10
                      itemType: SampleType
                      capacity: 2
                      capacityUnit: g
                      weight: 5
                      weightUnit: g
                      recommend: false
                      featuredFlag: false
                      pickupPoint: Sample location
                      productImage: [image1.jpg, image2.jpg]
                      infoText: "key1:1,key2:2,key3:3"
                      noteList: [note1, note2, note3]
                      displayOrder: 1
                      altSortOrder: 10
                      altPrice: 500
                      altCurrency: USD
                      limitRules:
                        - withinHours: 24
                          targetRoutes: [AAA-BBB, BBB-AAA, AAA-CCC]
                productImage:
                  type: array
                  minItems: 1
                  maxItems: 10
                  description: >
                    Image files (image/*, max 5 MB each). Must be in the same
                    order, and the same count, as `product.productImage` in the
                    payload.
                  items:
                    type: string
                    format: binary
            encoding:
              payload:
                contentType: application/json
              productImage:
                contentType: image/*
      responses:
        "201":
          description: Product accepted; image names replaced with stored URLs.
        "400":
          description: >
            Invalid request: payload not valid JSON, missing category /
            product.itemCode, price not a non-negative number, no image,
            image count differs from product.productImage, non-image file, or
            file over 5 MB.
          content:
            application/json:
              examples:
                missingImage:
                  value: { success: false, error: At least one productImage is required }
                nameMismatch:
                  value:
                    success: false
                    error: product.productImage must list one file name per uploaded image
components:
  schemas:
    LimitRule:
      type: object
      properties:
        withinHours:
          type: integer
          example: 24
        targetRoutes:
          type: array
          items:
            type: string
          example: [AAA-BBB, BBB-AAA, AAA-CCC]
    Product:
      type: object
      required: [itemCode, price]
      properties:
        itemCode:
          type: string
          example: SAMPLE
        pricingModel:
          type: string
          example: SAMPLE_A
        tags:
          type: array
          items:
            type: integer
          example: [1, 2]
        saleStartDate:
          type: string
          description: "yyyy-MM-dd HH:mm:ss"
          example: "2026-08-01 00:00:00"
        saleEndDate:
          type: string
          example: "2026-08-31 23:59:59"
        applicationStartDate:
          type: string
          example: "2026-08-01 00:00:00"
        applicationEndDate:
          type: string
          example: "2026-12-31 23:59:59"
        price:
          type: number
          minimum: 0
          example: 500
        currency:
          type: string
          example: USD
        visibleOnWeb:
          type: boolean
        discountRate:
          type: number
          example: 10
        memberDiscountNote:
          type: string
          example: sample content
        secondaryDiscountRate:
          type: number
          example: 10
        itemType:
          type: string
          example: SampleType
        capacity:
          type: number
          example: 2
        capacityUnit:
          type: string
          example: g
        weight:
          type: number
          example: 5
        weightUnit:
          type: string
          example: g
        recommend:
          type: boolean
        featuredFlag:
          type: boolean
        pickupPoint:
          type: string
          example: Sample location
        productImage:
          type: array
          description: >
            Request: file names, in the same order as the uploaded
            `productImage` file parts. Response: the stored image URLs.
            The files themselves are not part of the JSON, because JSON cannot
            carry binary data; see the API description at the top.
            Limitation: only the count is validated and names are matched to
            files by position; the name values themselves are not checked.
          items:
            type: string
          example: [image1.jpg, image2.jpg]
        infoText:
          type: string
          example: "key1:1,key2:2,key3:3"
        noteList:
          type: array
          items:
            type: string
          example: [note1, note2, note3]
        displayOrder:
          type: integer
          example: 1
        altSortOrder:
          type: integer
          example: 10
        altPrice:
          type: number
          example: 500
        altCurrency:
          type: string
          example: USD
        limitRules:
          type: array
          items:
            $ref: "#/components/schemas/LimitRule"
    ProductPayload:
      type: object
      required: [category, product]
      properties:
        category:
          type: string
          example: SampleCategory
        product:
          $ref: "#/components/schemas/Product"
